<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login</title>
    <script src="Java Script/script.js"></script>
</head>
    
<body>
    <main class="login_container">
        <div class="login_form form">
            <div class="login_text">
                <h1>Welcome Back</h1>
                <p>Please sign in to your account</p>
            </div>
            <form action="#" class="form_menu login_form_menu">
                <div class="form_item login_form_item">
                    <label for="email" class="form_label">Email</label>
                    <input type="email" id="email" class="login_form_input form_input" placeholder="Enter your email">
                </div>
                <div class="form_item login_form_item">
                    <label for="password" class="form_label">Password</label>
                    <input type="password" id="password" class="login_form_input form_input"
                        placeholder="Enter your password">
                    <button type="button" class="password_toggle" onclick="togglePassword()">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button type="submit" class="btn form_btn">Login </button>
            </form>
            <div>
                <p class="login_form_text">
                    Don't have an account? <a href="signup.html" class="pricing_contact">Sign Up</a>
                </p>
            </div>
        </div>
    </main>
</body>

</html>
